<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | TechWorld</title><link rel="stylesheet" href="css/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="logo" href="index.html"><span class="logo-mark">TW</span>TechWorld</a><div style="margin-left:auto;font-size:13px;color:var(--muted)">🔒 Secure Checkout</div></div></nav>
<section class="section"><div class="container"><div class="form-card"><div class="section-head"><div><h2>Checkout</h2><p>Complete your shipping and payment details.</p></div></div><form onsubmit="placeOrder(event)"><div class="form-grid"><div class="field"><label>First name</label><input required placeholder="Saurabh"></div><div class="field"><label>Last name</label><input required placeholder="Tiwari"></div><div class="field full"><label>Email</label><input required type="email" placeholder="you@example.com"></div><div class="field full"><label>Address</label><textarea required rows="3" placeholder="House / Street / Area"></textarea></div><div class="field"><label>City</label><input required placeholder="Lucknow"></div><div class="field"><label>PIN code</label><input required pattern="[0-9]{6}" placeholder="226001"></div><div class="field full"><label>Payment method</label><select required><option>UPI</option><option>Credit / Debit Card</option><option>Cash on Delivery</option></select></div><div class="field full"><label style="display:flex;gap:8px;align-items:center"><input required type="checkbox"> I agree to the terms and confirm my order.</label></div></div><button class="btn btn-primary" style="width:100%;margin-top:20px">Place order securely →</button></form></div></div></section><div class="toast"></div>
<script src="js/products.js"></script><script src="js/app.js"></script><script>function placeOrder(e){e.preventDefault();if(!getCart().length){toast('Your cart is empty');return}localStorage.setItem('techworld_last_order',JSON.stringify({id:'TW'+Date.now().toString().slice(-7),date:new Date().toLocaleString(),status:'Confirmed'}));localStorage.removeItem('techworld_cart');toast('Order placed successfully ✓');setTimeout(()=>location.href='account.html',900)}</script></body></html>

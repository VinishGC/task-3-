<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Details | TechWorld</title><link rel="stylesheet" href="css/style.css"></head><body>
<nav class="navbar"><div class="container nav-inner"><a class="logo" href="index.html"><span class="logo-mark">TW</span>TechWorld</a><div class="search"><input placeholder="Search products..." onkeydown="if(event.key==='Enter')location.href='products.html?q='+encodeURIComponent(this.value)"></div><div class="nav-actions"><a class="icon-btn" href="account.html">◉</a><a class="icon-btn" href="cart.html">🛒<span class="badge cart-count">0</span></a></div></div></nav>
<section class="section"><div class="container"><a class="link" href="products.html">← Back to products</a><div id="detail" style="margin-top:18px"></div></div></section><div class="toast"></div>
<script src="js/products.js"></script><script src="js/app.js"></script><script>
const p=products.find(x=>x.id==new URLSearchParams(location.search).get('id'))||products[0];
document.title=p.name+' | TechWorld';
document.getElementById('detail').innerHTML=`<div class="product-detail"><div class="detail-image"><img src="${p.img}" alt="${p.name}"></div><div class="detail-info"><span class="brand">${p.brand} • ${p.category}</span><h1>${p.name}</h1><div class="rating">★ ${p.rating} <span style="color:#94a3b8">Verified customer rating</span></div><div class="price"><strong>${money(p.price)}</strong><span class="old">${money(p.old)}</span><span class="discount">${Math.round((1-p.price/p.old)*100)}% OFF</span></div><span class="stock">✓ In stock • ${p.stock} units available</span><p style="color:var(--muted);margin:18px 0">Experience premium performance, thoughtful design and reliable everyday usability. This demo product page includes specifications, stock status, reviews and cart functionality.</p><div style="display:flex;gap:10px;align-items:center"><div class="quantity"><button onclick="changeQty(-1)">−</button><span id="qty">1</span><button onclick="changeQty(1)">+</button></div><button class="btn btn-primary" onclick="addToCart(${p.id},+document.getElementById('qty').textContent)">Add to cart 🛒</button><button class="btn btn-dark" onclick="addToCart(${p.id},+document.getElementById('qty').textContent);location.href='checkout.html'">Buy now</button></div><div class="specs">${Object.entries(p.specs).map(([k,v])=>`<div class="spec-row"><span>${k}</span><b>${v}</b></div>`).join('')}</div></div></div>`;
let qty=1;function changeQty(d){qty=Math.max(1,qty+d);document.getElementById('qty').textContent=qty}
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products | TechWorld</title><link rel="stylesheet" href="css/style.css"></head><body>
<div class="topbar"><div class="container"><span>⚡ Free shipping on orders above ₹999</span><span>Secure checkout • Easy returns</span></div></div><nav class="navbar"><div class="container nav-inner"><a class="logo" href="index.html"><span class="logo-mark">TW</span>TechWorld</a><div class="search"><input id="q" placeholder="Search products..."><button onclick="render()">⌕</button></div><div class="nav-actions"><a class="icon-btn" href="account.html">◉</a><a class="icon-btn" href="cart.html">🛒<span class="badge cart-count">0</span></a></div></div></nav>
<section class="page-head"><div class="container"><h1>Explore products</h1><p>Premium electronics, transparent specs and smart deals.</p></div></section>
<section class="section"><div class="container shop-layout"><aside class="filters"><h3>Filters</h3><div class="filter-group"><h4>Category</h4><label class="check"><input type="radio" name="cat" value="" checked> All categories</label><label class="check"><input type="radio" name="cat" value="Smartphones"> Smartphones</label><label class="check"><input type="radio" name="cat" value="Laptops & Tablets"> Laptops & Tablets</label><label class="check"><input type="radio" name="cat" value="Audio & Wearables"> Audio & Wearables</label><label class="check"><input type="radio" name="cat" value="Accessories"> Accessories</label></div><div class="filter-group"><h4>Brand</h4><label class="check"><input type="checkbox" value="Apple" class="brand"> Apple</label><label class="check"><input type="checkbox" value="Samsung" class="brand"> Samsung</label><label class="check"><input type="checkbox" value="Google" class="brand"> Google</label><label class="check"><input type="checkbox" value="Sony" class="brand"> Sony</label><label class="check"><input type="checkbox" value="Dell" class="brand"> Dell</label></div><div class="filter-group"><h4>Minimum rating</h4><select id="rating" class="select" style="width:100%"><option value="0">Any rating</option><option value="4">4+ stars</option><option value="4.5">4.5+ stars</option></select></div><button class="btn btn-dark" style="width:100%;margin-top:14px" onclick="clearFilters()">Reset filters</button></aside>
<div><div class="shop-top"><p id="resultCount" style="color:var(--muted);font-size:13px"></p><select id="sort" class="select" onchange="render()"><option value="featured">Featured</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option><option value="rating">Top Rated</option></select></div><div id="grid" class="products-grid"></div></div></div></section><div class="toast"></div>
<script src="js/products.js"></script><script src="js/app.js"></script><script>
const params=new URLSearchParams(location.search);document.getElementById('q').value=params.get('q')||'';if(params.get('cat')){document.querySelectorAll('[name=cat]').forEach(x=>x.checked=x.value===params.get('cat'))}
document.querySelectorAll('[name=cat],.brand,#rating').forEach(x=>x.addEventListener('change',render));
function render(){let arr=[...products],q=document.getElementById('q').value.toLowerCase().trim(),cat=document.querySelector('[name=cat]:checked').value,brands=[...document.querySelectorAll('.brand:checked')].map(x=>x.value),r=+document.getElementById('rating').value;
arr=arr.filter(p=>(!q||(p.name+' '+p.brand+' '+p.category).toLowerCase().includes(q))&&(!cat||p.category===cat)&&(!brands.length||brands.includes(p.brand))&&p.rating>=r);
const s=document.getElementById('sort').value;if(s==='low')arr.sort((a,b)=>a.price-b.price);if(s==='high')arr.sort((a,b)=>b.price-a.price);if(s==='rating')arr.sort((a,b)=>b.rating-a.rating);
document.getElementById('resultCount').textContent=arr.length+' products found';document.getElementById('grid').innerHTML=arr.length?arr.map(productCard).join(''):'<div class="empty" style="grid-column:1/-1"><h3>No products found</h3><p>Try changing your search or filters.</p></div>'}
function clearFilters(){document.querySelector('[name=cat][value=""]').checked=true;document.querySelectorAll('.brand').forEach(x=>x.checked=false);document.getElementById('rating').value=0;document.getElementById('q').value='';render()}render();
</script></body></html>

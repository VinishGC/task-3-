<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopping Cart | TechWorld</title><link rel="stylesheet" href="css/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="logo" href="index.html"><span class="logo-mark">TW</span>TechWorld</a><div class="search"><input placeholder="Search products..." onkeydown="if(event.key==='Enter')location.href='products.html?q='+encodeURIComponent(this.value)"></div><div class="nav-actions"><a class="icon-btn" href="account.html">◉</a><a class="icon-btn" href="cart.html">🛒<span class="badge cart-count">0</span></a></div></div></nav>
<section class="section"><div class="container"><div class="section-head"><div><h2>Your shopping cart</h2><p>Review your items before checkout.</p></div><a class="link" href="products.html">Continue shopping →</a></div><div class="cart-layout"><div class="cart-items" id="items"></div><aside class="summary" id="summary"></aside></div></div></section><div class="toast"></div>
<script src="js/products.js"></script><script src="js/app.js"></script><script>
function renderCart(){const c=getCart();const box=document.getElementById('items');if(!c.length){box.innerHTML='<div class="empty"><div style="font-size:48px">🛒</div><h3>Your cart is empty</h3><p>Add some tech and come back here.</p><a class="btn btn-primary" style="margin-top:16px" href="products.html">Start shopping</a></div>';document.getElementById('summary').innerHTML='';return}
box.innerHTML=c.map(i=>{const p=products.find(x=>x.id===i.id);return `<div class="cart-item"><img src="${p.img}"><div><span class="brand">${p.brand}</span><h3>${p.name}</h3><p style="font-size:12px;color:var(--muted)">${money(p.price)} each</p></div><div class="item-price"><div class="quantity"><button onclick="change(${p.id},-1)">−</button><span>${i.qty}</span><button onclick="change(${p.id},1)">+</button></div><button style="background:none;color:#dc2626;font-size:11px;margin-top:8px" onclick="removeItem(${p.id})">Remove</button></div></div>`}).join('');
const subtotal=c.reduce((s,i)=>s+products.find(p=>p.id===i.id).price*i.qty,0),ship=subtotal>=999?0:99,discount=Math.round(subtotal*.05),total=subtotal+ship-discount;
document.getElementById('summary').innerHTML=`<h3>Order summary</h3><div class="summary-row"><span>Subtotal</span><b>${money(subtotal)}</b></div><div class="summary-row"><span>Shipping</span><b>${ship?money(ship):'FREE'}</b></div><div class="summary-row"><span>TechWorld offer</span><b style="color:var(--success)">-${money(discount)}</b></div><div class="summary-row summary-total"><span>Total</span><b>${money(total)}</b></div><a class="btn btn-primary" style="width:100%;margin-top:15px" href="checkout.html">Proceed to checkout →</a>`}
function change(id,d){let c=getCart(),i=c.find(x=>x.id===id);i.qty=Math.max(1,i.qty+d);saveCart(c);renderCart()}function removeItem(id){saveCart(getCart().filter(x=>x.id!==id));renderCart()}renderCart();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | TechWorld</title><link rel="stylesheet" href="css/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="logo" href="index.html"><span class="logo-mark">TW</span>TechWorld</a><div class="nav-actions" style="margin-left:auto"><a class="icon-btn" href="cart.html">🛒<span class="badge cart-count">0</span></a></div></div></nav><section class="section"><div class="container"><div class="section-head"><div><h2>My account</h2><p>Profile, orders and saved shopping preferences.</p></div></div><div class="trust"><div class="trust-card"><span>👤</span><div><b>Profile</b><p id="user">Guest User</p></div></div><div class="trust-card"><span>📦</span><div><b>Latest order</b><p id="order">No orders yet</p></div></div><div class="trust-card"><span>❤️</span><div><b>Wishlist</b><p id="wish">0 saved products</p></div></div><div class="trust-card"><span>🔐</span><div><b>Security</b><p>Demo authentication enabled</p></div></div></div><div class="section-head" style="margin-top:45px"><div><h2>Quick actions</h2></div></div><div style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn btn-dark" href="products.html">Continue shopping</a><a class="btn btn-primary" href="cart.html">View cart</a><button class="btn" style="background:#fee2e2;color:#991b1b" onclick="localStorage.removeItem('techworld_user');location.href='login.html'">Sign out</button></div></div></section><script src="js/app.js"></script><script>document.getElementById('user').textContent=localStorage.getItem('techworld_user')||'Guest User';const o=JSON.parse(localStorage.getItem('techworld_last_order')||'null');document.getElementById('order').textContent=o?o.id+' • '+o.status:'No orders yet';document.getElementById('wish').textContent=(JSON.parse(localStorage.getItem('techworld_wishlist')||'[]').length)+' saved products';</script></body></html>
